name: Release package quality test
# the MCX Studio packages are built from the tagged builds by mcx2026.sh after the
# tag is pushed, so this test is started by hand once they are online
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'package name: tests MCXStudio-<os>-<name>.zip'
        default: 'github-latest'
      folder:
        description: 'folder under https://mcx.space/nightly/ that holds the packages, e.g. release/v2026'
        default: 'github'

env:
  NAME: ${{ github.event.inputs.name || 'github-latest' }}
  NIGHTLY_URL: https://mcx.space/nightly/${{ github.event.inputs.folder || 'github' }}

jobs:
  release_test:
    name: Release package tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            pkg: linux-x64
          - os: ubuntu-24.04
            pkg: linux-x64
          - os: macos-15-intel
            pkg: macos-x64
          - os: macos-14
            pkg: macos-arm64
          - os: windows-2022
            pkg: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install OpenCL (Linux only)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev libpocl2 pocl-opencl-icd
          echo "POCL_EXTRA_BUILD_FLAGS=-cl-std=CL1.2" >> $GITHUB_ENV
          echo "POCL_KERNEL_CACHE=0" >> $GITHUB_ENV
      - name: Install OpenCL.dll (Windows only)
        if: ${{ runner.os == 'Windows' }}
        run: |
          vcpkg --triplet=x64-windows install opencl
          cp 'c:\vcpkg\packages\opencl_x64-windows\bin\OpenCL.dll' 'c:\Windows\System32'
      - name: Download release package
        run: |
          curl -fsSL --retry 3 -o package.zip "$NIGHTLY_URL/MCXStudio-${{ matrix.pkg }}-$NAME.zip"
          unzip -q -o package.zip
          ls MCXStudio MCXStudio/MCXSuite MCXStudio/MATLAB
      - name: Test mcx
        if: ${{ matrix.os != 'macos-14' }}
        run: |
          cd MCXStudio/MCXSuite/mcx/bin
          ./mcx --version
          # the runners have no NVIDIA GPU
          ./mcx -L || true
          ./mcx -Q cube60b --dumpjson
      - name: Test mcxcl
        run: |
          cd MCXStudio/MCXSuite/mcxcl/bin
          ./mcxcl --version
          ./mcxcl -L || true
          ./mcxcl -Q cube60 -n 1e5 || true
          ./mcxcl -Q cube60b -n 1e5 || true
      - name: Test mmc
        run: |
          cd MCXStudio/MCXSuite/mmc/bin
          ./mmc --version
          ./mmc -L || true
          ./mmc -Q dmmc-cube60 -G -1 -n 1e5
          ./mmc -Q dmmc-cube60b -G -1 -n 1e5
          ./mmc -Q dmmc-cube60 -G -1 -D P -n 1e5
          ./mmc -Q edgeimmc -G -1 -n 1e5
          ./mmc -Q nodeimmc -G -1 -n 1e5
          ./mmc -Q faceimmc -G -1 -n 1e5
      - name: Test umcx
        run: |
          cd MCXStudio/MCXSuite/umcx/bin
          ./umcx --bench cube60 -n 1e5
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
      - name: Run MATLAB mcxlabcl test
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: cd MCXStudio; mcxsuite_addpath; cd MATLAB/mcxlabcl/examples; disp(mcxlabcl('gpuinfo')); demo_mcxlab_basic; demo_mcxlab_2d; demo_mcxlab_replay; demo_bc_det; demo_photon_sharing;
      - name: Run MATLAB mmclab test
        if: ${{ matrix.os != 'macos-14' }}
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: cd MCXStudio; mcxsuite_addpath; cd MATLAB/mmclab/example; disp(mmclab('gpuinfo')); demo_mmclab_basic; demo_example_meshtest; demo_example_replay; demo_wide_det; demo_photon_sharing;
      - name: Run MATLAB umcxlab test
        continue-on-error: true
        uses: matlab-actions/run-command@v2
        with:
          command: cd MCXStudio; mcxsuite_addpath; res = umcxlab(mcxcreate('cube60')); disp(size(res.flux));
