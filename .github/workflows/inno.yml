name: Build+Upload the MCX Studio Windows installer

# the Inno Setup installers of the whole MCX suite, made from the portable Windows
# packages that mcx2026.sh writes after the CI builds: MCXStudio-windows-x64-<name>.zip,
# and the NVIDIA edition MCXStudio-nvidia-windows-x64-<name>.zip (mmc-trinity, with
# the CUDA and OptiX backends of mmc), when that package exists; dormant
# unless one of these starts it:
#   - a push that changes inno/ (installs the github-latest package)
#   - by hand:  gh workflow run inno.yml -R fangq/mcx -f name=v2026
#   - mcx2026.sh, after it writes the package (a repository_dispatch "inno" event
#     whose client_payload.name is the package name)
on:
  push:
    branches:
      - master
    paths:
      - 'inno/**'
  workflow_dispatch:
    inputs:
      name:
        description: 'package name: installs MCXStudio[-nvidia]-windows-x64-<name>.zip'
        default: 'github-latest'
  repository_dispatch:
    types: [inno]

env:
  NAME: ${{ github.event.inputs.name || github.event.client_payload.name || 'github-latest' }}
  NIGHTLY_URL: https://mcx.space/nightly

jobs:
  build_installer:
    name: Build the ${{ matrix.bundle }} installer
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: MCXStudio
            edition: ''
          - bundle: MCXStudio-nvidia
            edition: ' (NVIDIA)'
    env:
      PKG: ${{ matrix.bundle }}-windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the installer script
        uses: actions/checkout@v4
        with:
          sparse-checkout: inno
      - name: Download the portable Windows package
        id: package
        run: |
          # nightly/github, or the release folder of a tagged release (where mcx2026.sh
          # writes the NVIDIA edition of a release)
          for url in "$NIGHTLY_URL/github/$PKG-$NAME.zip" "$NIGHTLY_URL/release/$NAME/$PKG-$NAME.zip"; do
              curl -fsSL --retry 3 -o package.zip "$url" && echo "from $url" && break
              rm -f package.zip
          done
          if [ ! -f package.zip ]; then
              # the NVIDIA edition is made only when the mmclab-trinity package exists
              if [ "${{ matrix.bundle }}" != MCXStudio ]; then
                  echo "::notice::no $PKG-$NAME.zip, the ${{ matrix.bundle }} installer is skipped"
                  echo "found=0" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
              echo "::error::no $PKG-$NAME.zip"
              exit 1
          fi
          echo "found=1" >> "$GITHUB_OUTPUT"
          7z x -y -bd package.zip > /dev/null
          ls MCXStudio
          # the package leaves out inno/; the installer script of this commit is used
          cp -r inno MCXStudio/inno
      - name: Build the installer
        if: steps.package.outputs.found == '1'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then
              choco install innosetup -y --no-progress
          fi
          # the Chinese translations are unofficial and not shipped with Inno Setup;
          # fetch those of the installed version (e.g. 6.4.3 -> tag is-6_4_3)
          # ISCC.exe carries no version (0.0.0.0): take that of the installation, or of
          # the compiler engine ISCmplr.dll
          VER=$(powershell -NoProfile -Command "\$k = Get-ItemProperty 'HKLM:\\SOFTWARE\\WOW6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Inno Setup 6_is1','HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Inno Setup 6_is1' -ErrorAction SilentlyContinue | Select-Object -First 1; if (\$k) { \$k.DisplayVersion } else { (Get-Item '$(cygpath -w "$(dirname "$ISCC")")\\ISCmplr.dll').VersionInfo.FileVersion }" | tr -d '\r' || true)
          echo "Inno Setup version: '$VER'"
          VER=$(echo "$VER" | grep -o -m1 '[0-9]\+\.[0-9]\+\.[0-9]\+' || true)
          LANGDIR="$(dirname "$ISCC")/Languages"
          # those of the installed version, or of 6.4.3 (renamed messages are then
          # ignored with a warning, and shown in English)
          for lang in ChineseSimplified ChineseTraditional; do
              [ -f "$LANGDIR/$lang.isl" ] && continue
              for TAG in is-$(echo "${VER:-0}" | tr . _) is-6_4_3; do
                  curl -fsSL --retry 3 -o "$LANGDIR/$lang.isl" \
                      "https://raw.githubusercontent.com/jrsoftware/issrc/$TAG/Files/Languages/Unofficial/$lang.isl" && break
              done
              echo "$lang.isl from $TAG"
          done
          mkdir -p packages
          cd MCXStudio/inno
          # the edition label, e.g. " (NVIDIA)", is shown after the version in the
          # installer and in Apps & features; the standard edition keeps the default ""
          EDITION=()
          [ -n "${{ matrix.edition }}" ] && EDITION=("//DMyAppEdition=${{ matrix.edition }}")
          "$ISCC" //DMyAppVersion="$NAME" "${EDITION[@]}" //O"$GITHUB_WORKSPACE\\packages" //F"$PKG-$NAME-installer" MCXStudio.iss
          ls -l "$GITHUB_WORKSPACE/packages"
      - name: Upload the installer
        if: steps.package.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.bundle }}
          path: packages/${{ matrix.bundle }}-windows-x64-*-installer.exe

  upload_installer:
    name: Upload the installer
    needs: build_installer
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'fangq' }}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: packages
      - name: Copy the installers to the server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/*"
          remote_path: ${{ secrets.MCX_CI_PATH }}
