# MCX Cloud v2 — Apache reverse proxy for the Node API (manager: zodiac.coe.neu.edu)
#
# Purpose: the static frontend on https://mcx.space (IONOS) makes cross-origin fetch/SSE
# calls from the visitor's browser to this API. Because mcx.space is HTTPS, the API MUST
# be reached over HTTPS too (browsers block http:// calls from an https:// page). Apache
# already terminates TLS for zodiac.coe.neu.edu (Let's Encrypt), so we proxy an /api/ path
# to the local Node API (127.0.0.1:8080) and keep the API itself bound to localhost.
#
# Install (needs sudo):
#   1. Add the <Location> block below INSIDE the *:443 zodiac.coe.neu.edu vhost
#      (e.g. /etc/apache2/sites-available/000-default-le-ssl.conf), OR include this file
#      from within that vhost:  Include /path/to/apache-mcxcloud.conf
#   2. Ensure modules are enabled (they already are on zodiac):
#        a2enmod proxy proxy_http headers
#   3. apache2ctl configtest && systemctl reload apache2
#
# Then the frontend sets:  window.MCX_API_BASE = 'https://zodiac.coe.neu.edu/api'
# (CORS_ORIGIN in the API .env must equal the frontend origin, e.g. https://mcx.space)

<IfModule mod_proxy.c>
    ProxyPreserveHost On

    # Do NOT let Apache add its own CORS headers — the Node API sets Access-Control-*
    # itself (including for the SSE endpoint). Adding them here would duplicate ACAO.

    <Location "/api/">
        ProxyPass        "http://127.0.0.1:8080/" connectiontimeout=5 timeout=3600 keepalive=On
        ProxyPassReverse "http://127.0.0.1:8080/"

        # SSE (GET /api/jobs/:id/stream) is a long-lived streaming response. mod_proxy_http
        # streams by default; the long `timeout` above keeps the stream open. If events
        # appear buffered/delayed, disable compression for the stream:
        #   SetEnvIf Request_URI "/jobs/.*/stream$" no-gzip=1
    </Location>
</IfModule>
